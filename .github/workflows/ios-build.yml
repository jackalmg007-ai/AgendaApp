name: iOS Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project AgendaApp.xcodeproj \
            -scheme AgendaApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test install and launch on Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -m 1 "iPhone 16" | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')

          echo "DEVICE_ID=$DEVICE_ID"

          xcrun simctl boot "$DEVICE_ID" || true

          xcrun simctl bootstatus "$DEVICE_ID" -b

          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData \
            -path '*Build/Products/Debug-iphonesimulator/AgendaApp.app' \
            -print -quit)

          echo "APP_PATH=$APP_PATH"

          echo "=== Installing AgendaApp ==="
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"

          echo "=== INSTALL SUCCESS ==="

          echo "=== Launching AgendaApp ==="
          xcrun simctl launch "$DEVICE_ID" com.example.Agenda

          echo "=== LAUNCH SUCCESS ==="

      - name: Package simulator app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path '*Build/Products/Debug-iphonesimulator/AgendaApp.app' -print -quit)
          mkdir -p artifacts
          ditto "$APP_PATH" artifacts/AgendaApp.app
          ditto -c -k --sequesterRsrc --keepParent artifacts/AgendaApp.app artifacts/AgendaApp-Simulator.zip

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgendaApp-iOS-Simulator
          path: artifacts/AgendaApp-Simulator.zip
