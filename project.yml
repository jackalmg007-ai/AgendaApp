name: AgendaApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: 6.0
    PRODUCT_BUNDLE_IDENTIFIER: com.example.Agenda
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  AgendaApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Core
      - path: Components
      - path: Animation
      - path: Features
    settings:
      base:
        INFOPLIST_FILE: Config/Info.plist
        PRODUCT_NAME: AgendaApp
    scheme:
      gatherCoverageData: false
